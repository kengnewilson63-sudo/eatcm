[build]
  # Commande de build utilisee par Netlify
  command = "npm run build -- --configuration production"
  publish = "dist/eatscm-frontend/browser"

[build.environment]
  NODE_VERSION = "22"

# SPA Angular : sans cette regle, ouvrir ou recharger une route comme
# /dashboard/livreur renvoie une 404 (le serveur cherche un fichier).
# Toutes les routes doivent etre servies par index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache long pour les fichiers versionnes par le build Angular.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# En-tetes de securite de base.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
