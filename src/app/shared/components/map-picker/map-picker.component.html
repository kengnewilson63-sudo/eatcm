<div class="rounded-2xl overflow-hidden border border-gray-100">
  <div id="eatscm-map" style="width:100%;height:260px;display:block;"></div>
  <div class="p-4 bg-white space-y-3">
    <button (click)="utiliserMaPosition()" [disabled]="chargement()"
            class="flex items-center gap-2 px-4 py-2.5 bg-white rounded-full text-sm font-semibold text-secondary border border-gray-200 hover:border-primary hover:text-primary transition-all cursor-pointer disabled:opacity-50 w-full justify-center">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      {{ chargement() ? 'Localisation en cours...' : 'Utiliser ma position GPS' }}
    </button>
    <!-- CORRECTION #4 — Message d'erreur GPS clair -->
    @if (erreur()) {
      <div class="flex items-start gap-2 px-3 py-3 bg-red-50 rounded-xl border border-red-100">
        <svg class="w-4 h-4 text-red-500 flex-shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <p class="text-xs text-red-600 font-medium leading-relaxed">{{ erreur() }}</p>
      </div>
    }
    @if (position()) {
      <div class="flex items-center gap-2 px-3 py-2.5 bg-gray-50 rounded-xl">
        <svg class="w-4 h-4 text-primary flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
        <p class="text-xs text-secondary font-medium truncate">{{ position()!.adresse }}</p>
      </div>
      <button (click)="confirmerPosition()" class="w-full py-3 rounded-full text-white font-bold text-sm border-none cursor-pointer active:scale-95 transition-all" style="background:#FF5A36">
        Confirmer cette position
      </button>
    }
    <p class="text-[11px] text-muted text-center">Clique sur la carte pour placer ton adresse précisément </p>
  </div>
</div>
