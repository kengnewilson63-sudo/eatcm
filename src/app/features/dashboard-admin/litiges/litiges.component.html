<div class="page-enter space-y-5">
  <h2 class="text-xl font-extrabold text-secondary">Litiges & Réclamations</h2>
  <div class="space-y-3">
    @for (l of litiges(); track l.id) {
      <div class="dashboard-card">
        <div class="flex items-start justify-between gap-3 mb-2">
          <div class="flex-1">
            <div class="flex items-center gap-2 mb-1">
              <span class="text-sm font-bold text-secondary">#{{l.commandeId}}</span>
              <span class="px-2.5 py-0.5 rounded-full text-xs font-bold" [class]="badgeClass(l.statut)">{{l.statut}}</span>
            </div>
            <p class="text-sm font-semibold text-secondary">Client #{{l.clientId}}</p>
            <p class="text-xs text-primary font-semibold mt-0.5">{{l.type.replace('_',' ')}}</p>
            <p class="text-xs text-muted mt-1 leading-relaxed">{{l.description}}</p>
          </div>
        </div>
        @if (l.statut === 'OUVERT' || l.statut === 'EN_TRAITEMENT') {
          <div class="flex gap-2 mt-3 pt-3 border-t border-gray-50">
            <button (click)="resoudre(l.id)" class="flex-1 py-2 rounded-xl bg-success text-white text-xs font-bold border-none cursor-pointer">✓ Résoudre</button>
            <button (click)="fermer(l.id)"   class="flex-1 py-2 rounded-xl bg-gray-100 text-gray-600 text-xs font-bold border-none cursor-pointer">Fermer</button>
          </div>
        }
      </div>
    }
  </div>
</div>
