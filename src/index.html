<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>EatsCM — Livraison de repas à Douala</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FF5A36">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Google Maps — remplace YOUR_API_KEY par ta vraie clé -->
  <script>
    window.__googleMapsLoaded = false;
    window.__googleMapsError  = false;

    function initGoogleMaps() {
      window.__googleMapsLoaded = true;
    }

    function googleMapsError() {
      window.__googleMapsError = true;
      console.warn('Google Maps failed to load');
    }
  </script>
  <script
    src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=places,geocoder&language=fr&region=CM&callback=initGoogleMaps&onerror=googleMapsError"
    async defer>
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
