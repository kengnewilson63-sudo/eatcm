<nav class="bottom-nav md:hidden">
  <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="nav-item">
    <span class="nav-icon-wrap"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
    <span class="nav-label">Accueil</span>
  </a>
  <a routerLink="/discover" routerLinkActive="active" class="nav-item">
    <span class="nav-icon-wrap"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></span>
    <span class="nav-label">Découvrir</span>
  </a>
  <!-- Panier central — CLIENT uniquement -->
  @if (isClient()) {
    <a routerLink="/panier" routerLinkActive="active" class="nav-item nav-item--cart">
      <span class="cart-btn">
        <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        @if (totalItems() > 0) { <span class="cart-badge">{{ totalItems() > 9 ? '9+' : totalItems() }}</span> }
      </span>
      <span class="nav-label mt-1">Panier</span>
    </a>
  } @else {
    <!-- Dashboard pour restaurant/livreur/admin -->
    <a [routerLink]="role()==='RESTAURANT'?'/dashboard/restaurant':role()==='LIVREUR'?'/dashboard/livreur':'/dashboard/admin'"
       routerLinkActive="active" class="nav-item nav-item--cart">
      <span class="cart-btn">
        <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      </span>
      <span class="nav-label mt-1">Dashboard</span>
    </a>
  }
  <a routerLink="/search" routerLinkActive="active" class="nav-item">
    <span class="nav-icon-wrap"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
    <span class="nav-label">Recherche</span>
  </a>
  <a routerLink="/profil" routerLinkActive="active" class="nav-item">
    <span class="nav-icon-wrap"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
    <span class="nav-label">Profil</span>
  </a>
</nav>
